[project]
name = "obsidian-rag-mcp"
version = "0.1.0"
description = "MCP server for RAG over an Obsidian vault — bring your notes into goose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2.0",
    "httpx>=0.27",
]

[project.scripts]
obsidian-rag-mcp = "obsidian_rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_rag"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
